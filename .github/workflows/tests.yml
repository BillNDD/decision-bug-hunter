name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      # -t . imports the tests package, whose init installs the socket guard.
      # Dummy keys prove no test depends on, or leaks, a real credential.
      - run: python -m unittest discover -s tests -t .
        env:
          OPENAI_API_KEY: dbh-ci-dummy-openai-key-not-a-credential
          OPENROUTER_API_KEY: dbh-ci-dummy-openrouter-key-not-a-credential
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m build --no-isolation
      - run: python tools/check_distribution.py dist
