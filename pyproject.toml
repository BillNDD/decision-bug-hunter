[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-bug-hunter"
dynamic = ["version"]
description = "Bounded source triage with a provider-independent judge contract"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Decision Bug Hunter contributors"}]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.14,<1", "mypy>=1.19,<2", "build>=1.3,<2"]

[project.scripts]
decision-bug-hunter = "decision_bug_hunter.__main__:main"

[tool.setuptools.packages.find]
include = ["decision_bug_hunter*"]

[tool.setuptools.package-data]
decision_bug_hunter = ["question_pack.json"]

[tool.setuptools.dynamic]
version = {attr = "decision_bug_hunter.__version__"}

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
files = ["decision_bug_hunter/providers.py", "decision_bug_hunter/decisions.py"]
check_untyped_defs = true
disallow_untyped_defs = true
follow_imports = "silent"
